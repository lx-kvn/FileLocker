<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>FileLocker — 造型探索 v2-1：iOS 26／macOS Tahoe Liquid Glass 風（修正版）</title>
<style>
  /* 修正說明：Apple 官方 HIG 對 Liquid Glass 有明確的使用邊界——玻璃材質只能用在浮在內容
     之上的「導覽層」（工具列、分頁列、側欄、浮動動作按鈕、彈出選單、搜尋框），絕對不能用在
     「內容層」（清單、卡片、表格、可捲動內容）。第一版把每一列清單項目都做成玻璃卡片，正是
     官方明講禁止的用法（會拖累可讀性、對比度也達不到 WCAG 4.5:1 的門檻）。這一版改成：只有
     側欄／工具列／浮動按鈕是玻璃，清單本身是不透明的白色卡片，坐在一塊實色的內容底板上。 */
  :root{
    --text:#1D1D1F; --text-secondary:#5B5B60; --text-tertiary:#8A8A90;
    --accent:#0A84FF; --accent-soft:rgba(10,132,255,.14);
    --glass-bg:rgba(255,255,255,.55); --glass-bg-strong:rgba(255,255,255,.68);
    --glass-border:rgba(255,255,255,.6);
    --content-bg:#F5F5F7; --card-bg:#FFFFFF; --card-border:#E5E5E7;
    --radius:26px; --radius-sm:16px;
    --font:-apple-system,'SF Pro Text','PingFang TC',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);color:var(--text);font-size:14px;height:100vh;overflow:hidden;
    /* 只在最外圈留一圈桌布漸層，讓側欄/工具列這層玻璃有「東西可以折射」——
       這圈只在玻璃導覽層的外緣看得到一點點，不會大面積蓋住內容 */
    background:
      radial-gradient(circle at 12% 15%, #E9D9F5 0%, transparent 42%),
      radial-gradient(circle at 88% 10%, #CFE6FB 0%, transparent 46%),
      linear-gradient(160deg, #EEF1F6 0%, #F3F0F7 100%);
  }
  .shell{display:flex;height:100vh;padding:16px;gap:14px;}

  /* Liquid Glass 側欄：導覽層，正確用法 */
  .sidebar{width:230px;flex-shrink:0;background:var(--glass-bg);backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border-radius:var(--radius);border:1px solid var(--glass-border);
    box-shadow:0 8px 32px rgba(31,38,135,.12), inset 0 1px 0 rgba(255,255,255,.8);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
  .brand__mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#0A84FF,#64D2FF);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(10,132,255,.35);}
  .brand__mark svg{width:17px;height:17px;stroke:#fff;}
  .brand__name{font-weight:650;font-size:15px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;color:var(--text-secondary);font-weight:500;font-size:13.5px;}
  .nav-item svg{width:17px;height:17px;stroke-width:1.7;flex-shrink:0;}
  .nav-item.active{background:rgba(255,255,255,.85);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06), inset 0 1px 0 #fff;}

  .main{flex:1;display:flex;flex-direction:column;gap:14px;overflow:hidden;}

  /* 工具列：同樣是浮在內容之上的導覽層，維持玻璃 */
  .toolbar{background:var(--glass-bg-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-radius:var(--radius-sm);border:1px solid var(--glass-border);
    box-shadow:0 6px 24px rgba(31,38,135,.1), inset 0 1px 0 rgba(255,255,255,.8);
    padding:16px 22px;display:flex;align-items:center;flex-wrap:wrap;gap:14px;flex-shrink:0;}
  .page-title{font-size:19px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px;}
  .page-title svg{width:19px;height:19px;color:var(--accent);}
  .toolbar__spacer{flex:1;}
  .pill-toggle{display:flex;background:rgba(120,120,128,.12);border-radius:999px;padding:3px;}
  .pill-toggle button{border:0;background:none;font:inherit;font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:999px;color:var(--text-secondary);}
  .pill-toggle button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .glass-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5);color:var(--text);font:inherit;font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);}
  .glass-btn.primary{background:linear-gradient(135deg,#0A84FF,#409CFF);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(10,132,255,.35);}
  .search-glass{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 14px;width:200px;}
  .search-glass svg{width:13px;height:13px;color:var(--text-tertiary);}
  .search-glass input{background:none;border:0;outline:0;font:inherit;font-size:12.5px;flex:1;}

  /* 內容層：實色底板 + 不透明卡片，不是玻璃——這是這次修正的核心 */
  .content-panel{flex:1;background:var(--content-bg);border-radius:var(--radius-sm);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .item-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
    padding:14px 18px;display:flex;align-items:center;gap:14px;}
  .item-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .item-icon svg{width:18px;height:18px;}
  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px;}
  .item-meta{color:var(--text-tertiary);font-size:12px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .tag--lock{color:var(--accent);background:var(--accent-soft);}
  .tag--warn{color:#B25E00;background:#FFF1DE;}
  .item-actions{display:flex;gap:8px;flex-shrink:0;}
  .item-actions button{border:1px solid #DEDEE2;background:#fff;font:inherit;font-weight:600;font-size:12px;padding:7px 13px;border-radius:999px;color:var(--text);}
  .item-actions button.primary{background:var(--accent);color:#fff;border-color:transparent;}

  .batch-card{background:#EDF2F7;border:1px dashed #C7D2DE;border-radius:14px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
  .batch-card__label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;color:var(--text-secondary);}
  .stack{display:flex;}
  .stack div{width:22px;height:22px;border-radius:7px;margin-left:-7px;border:2px solid #EDF2F7;}

  /* 浮動主要動作按鈕：官方明列的正確玻璃用途之一，這裡示範成內容區右下角的懸浮圓鈕 */
  .fab-glass{position:absolute;right:34px;bottom:26px;display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,rgba(10,132,255,.9),rgba(64,156,255,.9));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;font:inherit;font-weight:650;font-size:13px;padding:13px 20px;border-radius:999px;
    box-shadow:0 10px 26px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.3);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div><span class="brand__name">FileLocker</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>加密檔案</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 3v13m0 0-4-4m4 4 4-4M5 21h14"/></svg>解密檔案</div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>已加密清單</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 3 4 6v6c0 5 3.5 7.7 8 9 4.5-1.3 8-4 8-9V6l-8-3Z"/></svg>資料夾防護</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="8.5" cy="15.5" r="3.5"/><path d="M11 13 19.5 4.5M19.5 4.5 22 7M17 6.5 19.5 9"/></svg>密碼庫</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9"/></svg>設定</div>
  </aside>

  <main class="main" style="position:relative;">
    <div class="toolbar">
      <h1 class="page-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>已加密清單</h1>
      <div class="pill-toggle"><button class="active">檔案</button><button>歷史紀錄</button></div>
      <div class="toolbar__spacer"></div>
      <div class="search-glass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="搜尋" /></div>
      <button class="glass-btn">重新整理</button>
    </div>

    <div class="content-panel">
      <div class="item-card">
        <div class="item-icon" style="background:#FFEBE9;"><svg viewBox="0 0 24 24" fill="none" stroke="#FF453A" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg></div>
        <div class="item-body"><div class="item-name">專案合約書.pdf</div><div class="item-meta"><span>PDF · 2.4 MB</span><span>合約相關</span><span>08-10 14:22</span></div></div>
        <div class="item-actions"><button class="primary">解密</button><button>Passkey</button></div>
      </div>
      <div class="item-card">
        <div class="item-icon" style="background:var(--accent-soft);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg></div>
        <div class="item-body"><div class="item-name">家庭照片備份</div><div class="item-meta"><span>資料夾 · 28 個檔案</span><span>1.2 GB</span><span>08-09 09:03</span></div></div>
        <div class="item-actions"><button class="primary">解密</button></div>
      </div>
      <div class="batch-card">
        <div class="batch-card__label"><div class="stack"><div style="background:#FF453A;"></div><div style="background:#0A84FF;"></div><div style="background:#30D158;"></div></div>批次加密：3 個檔案（報稅資料.xlsx、收據掃描.jpg 等）</div>
        <button style="border:1px solid #C7D2DE;background:#fff;font:inherit;font-weight:600;font-size:12px;padding:7px 13px;border-radius:999px;">全部解鎖</button>
      </div>
      <div class="item-card">
        <div class="item-icon" style="background:#F5E9FE;"><svg viewBox="0 0 24 24" fill="none" stroke="#BF5AF2" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 15l4-4 4 4 4-6 4 6"/></svg></div>
        <div class="item-body"><div class="item-name">密碼管理備份.zip <span class="tag tag--lock">🔒 ×2</span></div><div class="item-meta"><span>壓縮檔 · 890 KB</span><span>常用密碼</span><span>08-06 21:40</span></div></div>
        <div class="item-actions"><button class="primary">恢復金鑰</button></div>
      </div>
      <div class="item-card">
        <div class="item-icon" style="background:#E4F9EA;"><svg viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.8"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></div>
        <div class="item-body"><div class="item-name">遠端桌面憑證.pfx</div><div class="item-meta"><span>憑證檔 · 4 KB</span><span>公司 VPN</span><span>08-05 11:02</span></div></div>
        <div class="item-actions"><button class="primary">解密</button><button>Passkey</button></div>
      </div>
      <div class="item-card">
        <div class="item-icon" style="background:#F0F0F1;"><svg viewBox="0 0 24 24" fill="none" stroke="#8A8A90" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg></div>
        <div class="item-body"><div class="item-name">個人日記.docx <span class="tag tag--warn">⚠ 找不到指標檔</span></div><div class="item-meta"><span>Word · 156 KB</span><span>07-28 20:11</span></div></div>
        <div class="item-actions"><button class="primary">解密</button></div>
      </div>
    </div>

    <button class="fab-glass"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>加密新檔案</button>
  </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>FileLocker — 信封清單列組裝 v2</title>
<style>
  :root{ --brass:#A8770F; --brass-deep:#8C630C; --brass-tint:#FBF1DF; --void-red:#A23B2A; --void-tint:#F7E4DF; --ink:#3A331F; --ink-soft:#7A7256; --paper:#FFFDF8; --line:#E7DCC0; --ease:cubic-bezier(0.23,1,0.32,1); }
  body{margin:0;background:#EDEEF2;font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;padding:32px;}
  .page-title{font-size:20px;font-weight:700;color:var(--ink);margin:0 0 18px;display:flex;align-items:center;gap:14px;}
  .page-title img{width:64px;height:64px;}

  .list{display:flex;flex-direction:column;gap:10px;max-width:820px;}

  /* 統一列骨架：郵戳欄位是獨立、固定寬度的 grid 欄，不是跟著按鈕放在同一個 flex 容器裡——
     不然按鈕數量一多一少，郵戳圖示的水平位置就會跟著按鈕群組的總寬度一起飄移。
     固定欄位之後，不管這一列有 1 個按鈕還是 2 個，郵戳圖示永遠出現在同一個水平位置。 */
  .row{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 20px;
    display:grid;grid-template-columns:40px 0 1fr 150px auto;align-items:center;gap:16px;
    transition:border-color 150ms var(--ease);}
  .row:hover{border-color:#D8C89A;}

  .file-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .file-icon svg{width:19px;height:19px;}

  .tear-line{width:0;align-self:stretch;border-left:1.5px dashed var(--line);}

  .info{min-width:0;}
  .name{font-weight:650;font-size:14px;color:var(--ink);}
  .meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;}
  .meta span+span::before{content:"·";margin:0 6px;}

  /* 固定寬度＋靠右對齊：不管這一列是 1 個按鈕還是 2 個，.actions 這個欄位的寬度都一樣，
     按鈕永遠貼著欄位右緣——這樣郵戳欄位（緊接在 .actions 前面）的水平位置才會真正固定，
     不會因為隔壁按鈕欄位寬度不同而跟著飄移。寬度抓 200px，足夠容納「解密」+「恢復金鑰」
     兩個按鈕還有間距。 */
  .actions{display:flex;gap:8px;width:200px;justify-content:flex-end;align-items:center;}
  .actions button{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:12px;padding:8px 14px;border-radius:6px;cursor:pointer;transition:transform 150ms var(--ease),border-color 150ms var(--ease);}
  .actions button:active{transform:scale(0.97);}
  .actions button:hover{border-color:var(--brass);color:var(--brass-deep);}

  /* 郵戳徽章：圖案跟文字改成左右並排，不再疊在一起——疊在圖案的波浪線上會讀不清楚。
     .postmark-slot 現在是 .row 自己的 grid 欄位（固定 150px），不是塞在 .actions 裡面，
     水平位置不會受按鈕數量影響。欄位本身高度設得很矮（跟按鈕差不多），真正的圖案/文字
     用 position:absolute 疊上去、蓋過列的上下邊界——這樣圖示可以維持大尺寸看得清楚細節，
     又不會把整列的高度撐開。 */
  .postmark-slot{position:relative;height:36px;}
  .postmark{position:absolute;left:0;top:50%;width:150px;transform:translateY(-50%);display:flex;align-items:center;gap:8px;}
  .postmark img{width:80px;height:80px;object-fit:contain;flex-shrink:0;}
  .postmark .pm-text{font-size:12px;font-weight:800;letter-spacing:-.01em;line-height:1.3;white-space:normal;max-width:58px;}
  .postmark.lock .pm-text{color:var(--brass-deep);}
  .postmark.warn .pm-text{color:var(--void-red);}

  .batch-row{background:var(--brass-tint);border-color:#EAD5A6;}
</style>
</head>
<body>
  <h1 class="page-title"><img src="../../assets/Envelope_Wax_Seal.svg" alt="" />已加密清單</h1>

  <div class="list">
    <div class="row">
      <div class="file-icon" style="background:#FBEAE6;"><svg viewBox="0 0 24 24" fill="none" stroke="#C1502F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg></div>
      <div class="tear-line"></div>
      <div class="info">
        <div class="name">專案合約書.pdf</div>
        <div class="meta"><span>PDF · 2.4 MB</span><span>合約相關</span><span>2026-08-10 14:22</span></div>
      </div>
      <span class="postmark-slot"></span>
      <div class="actions"><button>解密</button><button>Passkey</button></div>
    </div>

    <div class="row">
      <div class="file-icon" style="background:var(--brass-tint);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg></div>
      <div class="tear-line"></div>
      <div class="info">
        <div class="name">家庭照片備份</div>
        <div class="meta"><span>資料夾 · 28 個檔案</span><span>1.2 GB</span><span>2026-08-09 09:03</span></div>
      </div>
      <span class="postmark-slot"></span>
      <div class="actions"><button>解密</button></div>
    </div>

    <div class="row batch-row">
      <div class="file-icon" style="background:#fff;"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M4 7h16" opacity=".4"/></svg></div>
      <div class="tear-line"></div>
      <div class="info">
        <div class="name">批次加密：<strong>3 個檔案</strong></div>
        <div class="meta"><span>報稅資料.xlsx、收據掃描.jpg 等</span></div>
      </div>
      <span class="postmark-slot"></span>
      <div class="actions"><button>全部解鎖</button></div>
    </div>

    <div class="row">
      <div class="file-icon" style="background:#F1E9FC;"><svg viewBox="0 0 24 24" fill="none" stroke="#7B4FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 15l4-4 4 4 4-6 4 6"/></svg></div>
      <div class="tear-line"></div>
      <div class="info">
        <div class="name">密碼管理備份.zip</div>
        <div class="meta"><span>壓縮檔 · 890 KB</span><span>常用密碼</span><span>2026-08-06 21:40</span></div>
      </div>
      <span class="postmark-slot"><div class="postmark lock" title="巢狀鎖定 ×2"><img src="../../assets/Postmark_Nested_Lock.svg" alt="" /><span class="pm-text">×2</span></div></span>
      <div class="actions">
        <button>解密</button><button>恢復金鑰</button>
      </div>
    </div>

    <div class="row">
      <div class="file-icon" style="background:#E6F0FA;"><svg viewBox="0 0 24 24" fill="none" stroke="#2B6CB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></div>
      <div class="tear-line"></div>
      <div class="info">
        <div class="name">遠端桌面憑證.pfx</div>
        <div class="meta"><span>憑證檔 · 4 KB</span><span>公司 VPN</span><span>2026-08-05 11:02</span></div>
      </div>
      <span class="postmark-slot"></span>
      <div class="actions"><button>解密</button><button>Passkey</button></div>
    </div>

    <div class="row">
      <div class="file-icon" style="background:#F1F1EF;"><svg viewBox="0 0 24 24" fill="none" stroke="#8A8878" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16" x2="15" y2="16"/></svg></div>
      <div class="tear-line"></div>
      <div class="info">
        <div class="name">個人日記.docx</div>
        <div class="meta"><span>Word 文件 · 156 KB</span><span>2026-07-28 20:11</span></div>
      </div>
      <span class="postmark-slot"><div class="postmark warn" title="找不到原始位置的指標檔"><img src="../../assets/Postmark_Warning.svg" alt="" /><span class="pm-text">指標遺失</span></div></span>
      <div class="actions">
        <button>解密</button>
      </div>
    </div>
  </div>
</body>
</html>

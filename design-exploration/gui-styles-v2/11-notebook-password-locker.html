<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>FileLocker — 密碼庫筆記本組裝測試</title>
<style>
  :root{
    --brass:#A8770F; --brass-deep:#8C630C; --green:#1F5C34; --green-deep:#164326;
    --ink:#3A331F; --ink-soft:#7A7256; --line:#CFC6AC; --ease:cubic-bezier(0.23,1,0.32,1);
  }
  body{margin:0;background:#EDEEF2;font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;padding:40px;}

  /* 這輪的座標全部直接從 Notebook_Body.svg 原始碼量出來，不是用眼睛在截圖上猜的：
     - 橫線本身：x 從 266.685 到 767.100（1024 為基準 → 26.04%~74.91%），y 從 233.097
       開始、間距固定 35.8121（→ 22.76% 起、每條間距 3.497%），總共 18 條，最後一條在 82.22%。
     - 封面/紙張本體（背景點陣圖）：x 182.34~841.34（17.81%~82.16%），y 70.65~952.65
       （6.90%~93.03%）。
     內容一律用橫線的左右邊界（26%/75%）當左右基準——比紙張本體邊界更窄，這樣天生就會
     跟螺旋裝訂圈（落在紙張本體左緣到橫線左緣之間那段）跟紙張右緣都留出緩衝，不會頂到邊。 */
  .notebook-outer{position:relative;width:760px;height:760px;}
  .notebook-body{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}

  .page-header{position:absolute;left:26%;right:25%;top:13.5%;}
  .page-title{font-size:21px;font-weight:700;color:var(--ink);margin:0 0 10px;line-height:1;}
  .toolbar{display:flex;gap:7px;align-items:center;}
  .search-box{flex:1;min-width:0;background:#FBF8F0;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-soft);box-sizing:border-box;}
  .toolbar button{border:1px solid var(--line);background:#FBF8F0;color:var(--ink);font:inherit;font-weight:600;font-size:11.5px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  /* 實心填色的按鈕視覺重量比空心的重，數字上跟旁邊的按鈕一樣大反而會顯得比較大——
     故意把 padding 縮一點點做視覺修正，兩個按鈕看起來才會一樣大。 */
  .toolbar button.primary{background:var(--brass);border-color:var(--brass);color:#fff;padding:5.5px 9.5px;}

  /* 每一列剛好是「一條橫線間距」（26.583px＝35.8121÷1024×760），列與列連續堆疊（一般
     文件流，不是每列各自絕對定位）——只要 .entry-list 的 top 精準對齊第一條線，靠正常
     文件流疊加寬度剛好會讓後面每一列自動落在下一條線的位置，內容置中之後自然落在「兩條
     線之間的空白處」，不會壓在任何一條線上（跟先前「隔一條線、置中在兩線之間」的做法不
     一樣，那個做法算出來的中心點剛好會落在被跳過的那條線上，看起來像壓在線上）。 */
  .entry-list{position:absolute;left:26%;right:25%;top:173px;display:flex;flex-direction:column;}
  .entry-row{position:relative;height:26.583px;display:grid;grid-template-columns:1fr auto 30px auto;align-items:center;gap:8px;box-sizing:border-box;}
  .entry-main{min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden;white-space:nowrap;}
  .entry-title{font-weight:650;font-size:12.5px;color:var(--ink);flex-shrink:0;}
  .entry-meta{font-size:10.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;}
  .entry-cat{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .entry-cat.website{background:var(--brass);}
  .entry-cat.file{background:var(--green);}

  /* 眼睛圖示原本 15px 太小，使用者第一眼看成一個點——放大到 19px，線條也加粗一點。 */
  .entry-secret{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);}
  .entry-secret .dots{letter-spacing:1.5px;}
  .eye-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;}
  .eye-btn svg{width:19px;height:19px;}

  /* TOTP 徽章獨立成固定寬度的欄位（30px，見上面 grid-template-columns），不是塞在
     .entry-actions 裡面跟編輯按鈕共用一個 flex 容器——不然沒有 TOTP 的列，.entry-actions
     會變窄，編輯按鈕的水平位置就會跟著有 TOTP 的列不一樣。固定欄位之後，不管這一列有沒有
     TOTP，編輯按鈕永遠在同一個水平位置。

     量過 Notebook_Pocket_Watch.svg 原始座標：錶面圓圈 cx=512 cy=512 r=240.008
     （以 1024 為基準），換算成這裡用的 36 單位 viewBox 是 r≈8.4，圓環才會剛好貼著
     錶面邊緣。徽章本身用絕對定位置中（不是跟著 flex 排），可以比 26.583px 的列高
     略大一點點也不會被裁切或撐開列高。 */
  .totp-slot{position:relative;height:100%;}
  .totp-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;}
  .totp-badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .totp-badge svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .totp-badge circle{fill:none;stroke-width:3;}
  .totp-badge .ring-bg{stroke:rgba(168,119,15,.2);}
  .totp-badge .ring-fg{stroke:var(--brass);stroke-linecap:round;}

  .entry-actions{display:flex;align-items:center;}
  .entry-actions button{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0;}
  .entry-actions button:hover{background:rgba(58,51,31,.08);color:var(--ink);}
  .entry-actions svg{width:13px;height:13px;}

  /* 分頁「上一頁 (1/3) 下一頁」：純文字，不加框，貼在紙張下緣附近，橫線區域結束後的
     留白位置。 */
  .pager{position:absolute;left:26%;right:25%;top:86%;display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;color:var(--ink-soft);}
  .pager button{border:none;background:none;font:inherit;color:var(--brass-deep);font-weight:600;cursor:pointer;padding:2px 4px;}
  .pager button:hover{text-decoration:underline;}
  .pager .page-num{color:var(--ink-soft);}

  /* 分類標籤：兩張圖檔本身在 1024x1024 的畫布裡，實際看得到的標籤形狀只佔中間一小塊
     （量出來 Notebook_Tab_Website.svg 是 x:499.8~654.8 y:315.4~709.4，
     Notebook_Tab_EncryptedFile.svg 是同樣 x、y:241.1~783.1），外圍一大圈透明留白——
     直接把整張圖用 object-fit:contain 塞進一個方框，文字疊上去會落在留白區、飄在標籤
     外面。改成用一個裁切窗口（.cat-tab-shape，overflow:hidden）只露出量出來的那塊區域，
     圖片本身放大＋負值位移對齊進去，容器大小就是真正看得到的標籤形狀，文字疊上去才會
     真的在標籤裡面。

     兩張圖寬度相同（155）、高度不同（394 / 542，也就是使用者故意畫的「一長一短」），
     所以共用同一個縮放比例（顯示寬度 64px ÷ 原始寬度 155 ＝ 0.4129），高度分開算。

     標籤預設就貼齊內頁紙的右緣（.cat-tabs 錨定在紙張內緣，不是封面外緣），選中的標籤
     只往外多推一點點（+6px）、飽和度拉滿；未選中的往內收一點點（-6px）、降低飽和度——
     兩者都還是貼著紙緣，不會飄在半空中。

     改回左右對稱內縮（各 5px），再縮小到 34px 寬。

     使用者後來把兩張標籤素材本體調成一樣高了（原本「一長一短」394/542，現在兩張都是
     542），所以兩個分類不再需要分開量測、分開寫高度/位移——共用同一組數字即可。這也是
     上面那個標籤（網站帳密）先前被裁到的原因：素材尺寸換了，但我還在用舊的 394 那組
     位移數字去裁，兩邊對不上。 */
  .cat-tabs{position:absolute;left:80%;top:26%;display:flex;flex-direction:column;gap:9px;}
  .cat-tab{position:relative;width:34px;cursor:pointer;transition:transform 200ms var(--ease),filter 200ms var(--ease);}
  .cat-tab-shape{position:relative;width:34px;height:119px;overflow:hidden;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .cat-tab-shape img{position:absolute;width:224.6px;height:224.6px;left:-109.6px;top:-52.9px;}
  .cat-tab .tab-label{position:absolute;left:5px;right:5px;top:50%;transform:translate(-4px,-50%);text-align:center;font-size:12px;font-weight:700;color:#fff;writing-mode:vertical-rl;letter-spacing:0.5px;white-space:nowrap;}
  .cat-tab.inactive{filter:saturate(.55) brightness(1.05);opacity:.88;}
  .cat-tab.active{filter:saturate(1.15);}
</style>
</head>
<body>
  <div class="notebook-outer">
    <img class="notebook-body" src="../../assets/Notebook_Body.svg" alt="" />

    <div class="page-header">
      <h1 class="page-title">密碼庫</h1>
      <div class="toolbar">
        <input class="search-box" placeholder="搜尋帳密…" disabled />
        <button class="primary">＋ 新增帳密</button>
        <button>重新整理</button>
      </div>
    </div>

    <div class="entry-list">
      <div class="entry-row">
        <div class="entry-main"><span class="entry-cat website"></span><span class="entry-title">公司信箱</span><span class="entry-meta">mail.company.com</span></div>
        <div class="entry-secret"><span class="dots">••••••••</span><button class="eye-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="totp-slot">
          <div class="totp-badge">
            <img src="../../assets/Notebook_Pocket_Watch.svg" alt="" />
            <svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="8.4"/><circle class="ring-fg" cx="18" cy="18" r="8.4" stroke-dasharray="52.8" stroke-dashoffset="15.6"/></svg>
          </div>
        </div>
        <div class="entry-actions">
          <button title="編輯"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        </div>
      </div>

      <div class="entry-row">
        <div class="entry-main"><span class="entry-cat website"></span><span class="entry-title">GitHub</span><span class="entry-meta">github.com · gitlab.internal.co</span></div>
        <div class="entry-secret"><span class="dots">••••••••</span><button class="eye-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="totp-slot"></div>
        <div class="entry-actions">
          <button title="編輯"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        </div>
      </div>

      <div class="entry-row">
        <div class="entry-main"><span class="entry-cat file"></span><span class="entry-title">專案合約書.pdf</span><span class="entry-meta">已加密檔案關聯</span></div>
        <div class="entry-secret"><span class="dots">••••••••</span><button class="eye-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="totp-slot"></div>
        <div class="entry-actions">
          <button title="編輯"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        </div>
      </div>

      <div class="entry-row">
        <div class="entry-main"><span class="entry-cat website"></span><span class="entry-title">銀行網銀</span><span class="entry-meta">bank.example.com</span></div>
        <div class="entry-secret"><span class="dots">••••••••</span><button class="eye-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="totp-slot">
          <div class="totp-badge">
            <img src="../../assets/Notebook_Pocket_Watch.svg" alt="" />
            <svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="8.4"/><circle class="ring-fg" cx="18" cy="18" r="8.4" stroke-dasharray="52.8" stroke-dashoffset="38.4"/></svg>
          </div>
        </div>
        <div class="entry-actions">
          <button title="編輯"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        </div>
      </div>
    </div>

    <div class="pager">
      <button>‹ 上一頁</button>
      <span class="page-num">1 / 3</span>
      <button>下一頁 ›</button>
    </div>

    <div class="cat-tabs">
      <div class="cat-tab website active">
        <div class="cat-tab-shape"><img src="../../assets/Notebook_Tab_Website.svg" alt="" /></div>
        <span class="tab-label">網站帳密</span>
      </div>
      <div class="cat-tab file inactive">
        <div class="cat-tab-shape"><img src="../../assets/Notebook_Tab_EncryptedFile.svg" alt="" /></div>
        <span class="tab-label">已加密檔案</span>
      </div>
    </div>
  </div>
</body>
</html>

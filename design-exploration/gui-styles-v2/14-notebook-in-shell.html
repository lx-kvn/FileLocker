<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>FileLocker — 造型探索 v2-14：密碼庫筆記本接進側欄殼子</title>
<style>
  :root{
    --vault-steel:#F4F3F0; --vault-steel-dim:#ECEAE5; --vault-line:#E0DDD5; --vault-line-strong:#CFCAC0;
    --ink:#22221E; --ink-soft:#63604F; --ink-faint:#8B8776;
    --brass:#A8770F; --brass-deep:#8C630C; --brass-tint:#FBF1DF; --brass-line:#EAD5A6;
    --void-red:#A23B2A; --green:#1F5C34;
    --paper:#FFFDF8; --line:#E7DCC0;
    --radius:8px; --radius-sm:5px;
    --font-body:'IBM Plex Sans','Noto Sans TC',-apple-system,sans-serif;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --sidebar-w:200px; --sidebar-w-collapsed:60px;
    /* 筆記本內頁自己的一組 token（跟殼子的 --ink 等不共用，維持跟 11 號 mockup 一致） */
    --nb-ink:#3A331F; --nb-ink-soft:#7A7256; --nb-line:#CFC6AC;
    --nb-body-src:url('../../assets/Notebook_Body.svg');
  }
  /* 深色模式：殼子色調換成偏深的版本；筆記本內頁靠 JS 把 <img> 的 src 換成
     Notebook_Body_Drack.svg（線圈/橫線是燒進 SVG 的圖形內容，CSS 換不了顏色，見定案文件）。
     筆記本內頁文字色（--nb-ink / --nb-ink-soft / --nb-line）目前是這輪先估的淺色數字，
     之後要拿 Notebook_Body_Drack.svg 實際輸出的底色截圖比對微調，不是精算值。 */
  html[data-theme="dark"]{
    --vault-steel:#1E1D1A; --vault-steel-dim:#26241F; --vault-line:#38352D; --vault-line-strong:#4A4638;
    --ink:#EDEAE0; --ink-soft:#B7B09B; --ink-faint:#847D68;
    --brass-tint:#3A2F17; --brass-line:#5C4A22;
    --paper:#242119; --line:#3A3327;
    --nb-ink:#EFE9D6; --nb-ink-soft:#B9AF8F; --nb-line:#4A4230;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--ink);font-size:14px;background:var(--vault-steel);}

  .shell{height:100vh;display:flex;flex-direction:column;}
  .title-bar{height:38px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;
    -webkit-app-region:drag;border-bottom:1px solid var(--vault-line);background:var(--vault-steel);}
  .traffic-lights{display:flex;gap:8px;-webkit-app-region:no-drag;}
  .traffic-light{width:12px;height:12px;border-radius:50%;border:none;padding:0;}
  .traffic-light--close{background:#FF5F57;} .traffic-light--minimize{background:#FEBC2E;} .traffic-light--maximize{background:#28C840;}
  .title-bar__brand{margin-left:14px;font-weight:650;font-size:13px;color:var(--ink-soft);}
  .title-bar__spacer{flex:1;}
  /* 這只是測試用的深/淺色切換鈕，不是正式功能——正式的深色模式應該跟著系統設定／既有的
     settingsTheme 走，這裡只是為了讓這輪 mockup 能被截圖驗證兩種模式，不代表要新增一個
     這樣的按鈕到殼子標題列上。 */
  .theme-toggle{-webkit-app-region:no-drag;border:1px solid var(--vault-line-strong);background:var(--paper);
    color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;
    align-items:center;justify-content:center;font-size:13px;}

  .body{flex:1;display:flex;min-height:0;}

  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--vault-steel);border-right:1px solid var(--vault-line);
    padding:14px 10px;display:flex;flex-direction:column;gap:2px;transition:width 220ms var(--ease-out);overflow:hidden;}
  .sidebar.is-collapsed{width:var(--sidebar-w-collapsed);padding:14px 8px;}
  .sidebar__collapse-btn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;
    color:var(--ink-faint);font:inherit;font-size:12px;font-weight:600;padding:7px 8px;border-radius:var(--radius-sm);
    cursor:pointer;margin-bottom:14px;transition:background-color 150ms ease,color 150ms ease;white-space:nowrap;}
  .sidebar__collapse-btn:hover{background:var(--vault-steel-dim);color:var(--ink);}
  .sidebar__collapse-btn svg{width:15px;height:15px;flex-shrink:0;transition:transform 220ms var(--ease-out);}
  .sidebar.is-collapsed .sidebar__collapse-btn svg{transform:rotate(180deg);}
  .sidebar.is-collapsed .sidebar__collapse-btn{justify-content:center;}
  .sidebar__collapse-btn .label{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.is-collapsed .sidebar__collapse-btn .label{display:none;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
    color:var(--ink-soft);font-weight:500;font-size:13.5px;text-decoration:none;white-space:nowrap;
    position:relative;cursor:pointer;}
  .nav-item svg{width:16px;height:16px;stroke-width:1.7;flex-shrink:0;}
  .nav-item.active{color:var(--brass);font-weight:600;background:var(--brass-tint);}
  .nav-item:focus-visible{outline:2px solid var(--brass);outline-offset:-4px;border-radius:var(--radius-sm);}
  .sidebar.is-collapsed .nav-item{justify-content:center;padding:9px 0;}
  .sidebar.is-collapsed .nav-item .label{display:none;}
  .sidebar.is-collapsed .nav-item::after{
    content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%) scale(0.96);
    background:var(--ink);color:var(--paper);font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;
    white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 140ms ease,transform 140ms ease;z-index:20;}
  .sidebar.is-collapsed .nav-item:hover::after{opacity:1;transform:translateY(-50%) scale(1);}

  .main{flex:1;overflow-y:auto;padding:28px 40px 48px;min-width:0;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
  .page-title{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;color:var(--ink);}
  .page-title svg{width:19px;height:19px;color:var(--brass);}
  .page-stats{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink-faint);}

  /* 密碼庫「清單／設定」子分頁——直接照抄 13-sidebar-ticket-shell 的 .tabs 寫法，不是
     另外發明一套。 */
  .tabs{display:flex;gap:20px;margin-bottom:22px;border-bottom:1px solid var(--vault-line);}
  .tabs button{border:0;background:none;font:inherit;font-weight:600;font-size:13px;color:var(--ink-faint);
    padding:0 0 10px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--brass);}

  .subview{display:none;}
  .subview.active{display:block;}

  /* ============ 清單子分頁：筆記本畫布 ============ */
  .notebook-outer{position:relative;width:min(760px,100%);aspect-ratio:1;margin:0 auto;}
  .notebook-body{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}

  .page-header{position:absolute;left:26%;right:25%;top:13.5%;}
  .nb-title{font-size:21px;font-weight:700;color:var(--nb-ink);margin:0 0 10px;line-height:1;}
  .toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  /* 90px（不是原本嘗試的 130px）——14 號整合版工具列比 11 號多了「關聯到現有帳號」這顆
     按鈕，四個工具列項目全部塞進頁面內容可用寬度（372px，量測值）時，130px 的搜尋框會
     讓總寬度超出、被迫換行，換行後 .toolbar 變高、蓋到 .entry-list 固定 top:173px 那一列
     （截圖驗證時第一列文字看起來「壞掉」，其實是兩層元素疊在同一個位置，不是文字本身的
     bug）。90px 量過確認單行排得下，留了約 10px 餘裕。

     踩過的坑：原本這條規則最後寫了 `font:inherit` 想解決 <input> 預設不繼承頁面字體的問題，
     但 `font` 是簡寫屬性，寫在 `font-size:12px` 後面會把 font-size 一併重置回 body 繼承值
     （14px）——實測 getComputedStyle 量出來確實是 14px，不是寫的 12px，這正是使用者回報
     「搜尋框文字大小沒跟按鈕同步」的根本原因。改成只設 `font-family:inherit`（不用 `font`
     簡寫），font-size 明確跟旁邊按鈕（`.toolbar button` 用 11.5px）用同一個數字，垂直
     padding 也跟著調整到跟按鈕（30px 高，量測值）同高。 */
  .search-box{flex:0 1 90px;min-width:50px;background:var(--paper);border:1px solid var(--nb-line);border-radius:6px;
    padding:6px 8px;font-size:11.5px;font-family:inherit;color:var(--nb-ink-soft);box-sizing:border-box;}
  .toolbar button{border:1px solid var(--nb-line);background:var(--paper);color:var(--nb-ink);font:inherit;font-weight:600;
    font-size:11.5px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  .toolbar button.primary{background:var(--brass);border-color:var(--brass);color:#fff;padding:5.5px 9.5px;}

  .entry-list{position:absolute;left:26%;right:25%;top:173px;display:flex;flex-direction:column;}
  /* totp-code 欄位一定要用固定寬度（54px，量過「888 888」這種六碼滿版文字的實際寬度是
     52.5px，留一點餘裕），不能用 auto——這個專案已經在郵戳徽章欄位、按鈕欄位踩過同一個坑
     好幾次：每一列的 .entry-row 是各自獨立的 grid 容器，auto 欄寬是「這一列自己」的內容
     決定的，沒有 TOTP 碼的列（欄位是空字串）跟有 TOTP 碼的列，auto 欄寬會不一樣，1fr 的
     entry-main 拿到的剩餘空間也會跟著不一樣，後面所有欄位（眼睛圖示、圓環、編輯按鈕）的
     實際水平位置就會逐列跑位——這正是使用者這輪回報的「元素位置跟著其他東西的有無/長度
     一起跑」。固定寬度之後，不管這一列有沒有 TOTP，每一欄的位置永遠一致。 */
  .entry-row{position:relative;height:26.583px;display:grid;grid-template-columns:1fr auto 54px 30px auto;align-items:center;gap:8px;box-sizing:border-box;}
  .entry-main{min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden;white-space:nowrap;}
  .entry-title{font-weight:650;font-size:12.5px;color:var(--nb-ink);flex-shrink:0;}
  .entry-meta{font-size:10.5px;color:var(--nb-ink-soft);overflow:hidden;text-overflow:ellipsis;}
  .entry-cat{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .entry-cat.website{background:var(--brass);}
  .entry-cat.file{background:var(--green);}

  .entry-secret{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--nb-ink-soft);}
  .entry-secret .dots{letter-spacing:1.5px;}
  .eye-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--nb-ink-soft);flex-shrink:0;}
  .eye-btn svg{width:19px;height:19px;}

  /* 驗證碼數字本身——之前只有轉圈圈的環，沒有真正顯示 TOTP 碼，使用者要看驗證碼本身
     一定要能直接讀到數字，不是只看剩多少時間。獨立成自己的固定寬度欄位（跟 totp-slot 同一個
     理由：不能塞進 flex 排版的 .entry-actions，不然沒有 TOTP 的列跟有 TOTP 的列，編輯按鈕
     水平位置又會不一致）。三碼一組、中間留一個字距的空白（不是逗號/斜線），是這類驗證碼
     常見的排版慣例（跟簡訊驗證碼、Google Authenticator 的分組方式一致），比六碼連在一起
     好讀。 */
  .totp-code{font-family:ui-monospace,'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;
    color:var(--brass-deep);letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums;
    text-align:right;}
  .totp-slot{position:relative;height:100%;}
  .totp-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;}
  .totp-badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  /* 實心扇形（披薩切片），不是空心圓環——用 conic-gradient 畫，不用 SVG stroke 圓環。
     第一版直徑抓到剛好貼齊錶面內緣（15.7px），跟金色外框圈幾乎沒有間隙，使用者回饋
     「若有似無」——圓形太貼近外框，扇形本身的圓形輪廓線會被金色外框的顏色帶過去，看起來
     像融在一起，不像獨立的一個小圓形指示器。縮小到 12.5px（約錶面內緣直徑的 80%），
     跟金色外框之間留出可辨識的灰色錶面間隙，扇形才會讀成一個獨立、飄在錶面正中央的元素。 */
  .totp-pie{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12.5px;height:12.5px;
    border-radius:50%;background:conic-gradient(var(--brass) calc(var(--totp-ratio,0)*360deg),transparent 0);}

  .entry-actions{display:flex;align-items:center;}
  .entry-actions button{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--nb-ink-soft);display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0;}
  .entry-actions button:hover{background:rgba(58,51,31,.08);color:var(--nb-ink);}
  .entry-actions svg{width:13px;height:13px;}

  /* 分頁器——現在接了真正的分頁邏輯（見 script），不是寫死的 1/3 假資料。 */
  .pager{position:absolute;left:26%;right:25%;top:86%;display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;color:var(--nb-ink-soft);}
  .pager button{border:none;background:none;font:inherit;color:var(--brass-deep);font-weight:600;cursor:pointer;padding:2px 4px;}
  .pager button:hover:not(:disabled){text-decoration:underline;}
  .pager button:disabled{color:var(--nb-ink-soft);opacity:.45;cursor:default;text-decoration:none;}
  .pager .page-num{color:var(--nb-ink-soft);}

  .cat-tabs{position:absolute;left:80%;top:26%;display:flex;flex-direction:column;gap:9px;}
  .cat-tab{position:relative;width:34px;cursor:pointer;transition:transform 200ms var(--ease-out),filter 200ms var(--ease-out);border:none;background:none;padding:0;font:inherit;}
  .cat-tab-shape{position:relative;width:34px;height:119px;overflow:hidden;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .cat-tab-shape img{position:absolute;width:224.6px;height:224.6px;left:-109.6px;top:-52.9px;}
  .cat-tab .tab-label{position:absolute;left:5px;right:5px;top:50%;transform:translate(-4px,-50%);text-align:center;font-size:12px;font-weight:700;color:#fff;writing-mode:vertical-rl;letter-spacing:0.5px;white-space:nowrap;}
  /* 選中的標籤些微放大，錨點釘在標籤左緣（transform-origin:0% 50%），放大只往右長，
     左緣貼齊紙張內緣的位置不會跟著變動——見 11-notebook-password-locker.html 同一段註解。 */
  .cat-tab{transform-origin:0% 50%;}
  .cat-tab.inactive{filter:saturate(.55) brightness(1.05);opacity:.88;transform:scale(1);}
  .cat-tab.active{filter:saturate(1.15);transform:scale(1.07);}

  /* ============ 設定子分頁：完全跳出筆記本畫布，中性風格 ============ */
  .settings-page{max-width:640px;}
  .settings-section{padding:18px 0;border-bottom:1px solid var(--vault-line);display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .settings-section:last-child{border-bottom:none;}
  .settings-section h3{margin:0 0 4px;font-size:14px;font-weight:650;color:var(--ink);}
  .settings-section p{margin:0;font-size:12.5px;color:var(--ink-faint);line-height:1.5;}
  .btn{border:1px solid var(--vault-line-strong);background:var(--paper);color:var(--ink);font:inherit;font-weight:600;
    font-size:12.5px;padding:8px 15px;border-radius:var(--radius-sm);cursor:pointer;transition:transform 150ms var(--ease-out);flex-shrink:0;}
  .btn:active{transform:scale(0.97);}
  .btn--danger{border-color:var(--void-red);color:var(--void-red);}
</style>
</head>
<body>
<div class="shell">
  <header class="title-bar">
    <div class="traffic-lights">
      <button class="traffic-light traffic-light--close"></button>
      <button class="traffic-light traffic-light--minimize"></button>
      <button class="traffic-light traffic-light--maximize"></button>
    </div>
    <span class="title-bar__brand">FileLocker</span>
    <div class="title-bar__spacer"></div>
    <button class="theme-toggle" id="themeToggle" type="button" title="測試用：切換深/淺色">☀</button>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar__collapse-btn" id="collapseBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5 9 12l6 7"/></svg>
        <span class="label">收合側欄</span>
      </button>
      <nav>
        <div class="nav-item" data-label="加密">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1 1 12 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4" y="10" width="16" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>
          <span class="label">加密</span>
        </div>
        <div class="nav-item" data-label="資料夾防護">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3 4 6v6c0 5 3.5 7.7 8 9 4.5-1.3 8-4 8-9V6l-8-3Z"/></svg>
          <span class="label">資料夾防護</span>
        </div>
        <div class="nav-item active" data-label="密碼庫">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="4.25" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l9.5 9.5M16.5 15.5l3-3M19 18l2.5-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">密碼庫</span>
        </div>
        <div class="nav-item" data-label="設定">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">設定</span>
        </div>
      </nav>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1 class="page-title"><svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="4.25" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l9.5 9.5M16.5 15.5l3-3M19 18l2.5-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>密碼庫</h1>
        <div class="page-stats" id="pageStats"></div>
      </div>

      <div class="tabs">
        <button class="active" data-subview="list">清單</button>
        <button data-subview="settings">設定</button>
      </div>

      <!-- ============ 清單子分頁 ============ -->
      <div class="subview active" id="subview-list">
        <div class="notebook-outer">
          <img class="notebook-body" id="notebookBodyImg" src="../../assets/Notebook_Body.svg" alt="" />

          <div class="page-header">
            <h1 class="nb-title">密碼庫</h1>
            <div class="toolbar">
              <input class="search-box" id="searchBox" placeholder="搜尋帳密…" />
              <button class="primary" id="btnAdd">＋ 新增帳密</button>
              <button id="btnAssociate">關聯到現有帳號</button>
              <button id="btnRefresh">重新整理</button>
            </div>
          </div>

          <div class="entry-list" id="entryList"></div>

          <div class="pager">
            <button id="pagerPrev">‹ 上一頁</button>
            <span class="page-num" id="pagerNum"></span>
            <button id="pagerNext">下一頁 ›</button>
          </div>

          <div class="cat-tabs">
            <button class="cat-tab website active" id="tabWebsite" type="button">
              <div class="cat-tab-shape"><img src="../../assets/Notebook_Tab_Website.svg" alt="" /></div>
              <span class="tab-label">網站帳密</span>
            </button>
            <button class="cat-tab file inactive" id="tabFile" type="button">
              <div class="cat-tab-shape"><img src="../../assets/Notebook_Tab_EncryptedFile.svg" alt="" /></div>
              <span class="tab-label">已加密檔案</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ============ 設定子分頁：中性風格，不套筆記本主題 ============ -->
      <div class="subview" id="subview-settings">
        <div class="settings-page">
          <div class="settings-section">
            <div><h3>密碼庫密碼</h3><p>用來驗證進入密碼庫、顯示/複製/刪除憑證。</p></div>
            <button class="btn">變更密碼</button>
          </div>
          <div class="settings-section">
            <div><h3>Passkey</h3><p>選配的驗證方式，可以搭配 Windows Hello 使用。</p></div>
            <button class="btn">設定 Passkey</button>
          </div>
          <div class="settings-section">
            <div><h3>恢復金鑰</h3><p>密碼跟 Passkey 都遺失時的最後手段，請妥善保管。</p></div>
            <button class="btn">重新產生</button>
          </div>
          <div class="settings-section">
            <div><h3>CSV 匯入／匯出</h3><p>批次備份或搬移密碼庫內容。</p></div>
            <div style="display:flex;gap:8px;"><button class="btn">匯出</button><button class="btn">匯入</button></div>
          </div>
          <div class="settings-section">
            <div><h3>解除安裝部件</h3><p>移除密碼庫這個可選配部件，不影響加密/資料夾防護功能。</p></div>
            <button class="btn btn--danger">解除安裝</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  const sidebar = document.getElementById('sidebar');
  document.getElementById('collapseBtn').addEventListener('click', () => sidebar.classList.toggle('is-collapsed'));

  // 測試用深/淺色切換——正式功能應該跟著既有的 settingsTheme 走，這裡只是方便截圖驗證。
  const themeToggle = document.getElementById('themeToggle');
  const notebookBodyImg = document.getElementById('notebookBodyImg');
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
    themeToggle.textContent = isDark ? '☀' : '☾';
    notebookBodyImg.src = isDark
      ? '../../assets/Notebook_Body.svg'
      : '../../assets/Notebook_Body_Drack.svg';
  });

  // 子分頁（清單／設定）切換
  document.querySelectorAll('.tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.subview').forEach((v) => v.classList.remove('active'));
      document.getElementById(`subview-${btn.dataset.subview}`).classList.add('active');
    });
  });

  // ============ 清單資料 + 真正的分頁邏輯 ============
  // 範例資料量刻意超過一頁能放的行數，用來驗證「下一頁」按下去真的換一批不同內容，
  // 不是視覺假資料；ROWS_PER_PAGE=7，比內頁實際可容納的 13-14 行少一截，是刻意留白，
  // 避免測試時塞到跟分頁器文字打架。
  const ROWS_PER_PAGE = 7;
  const ALL_ENTRIES = [
    { cat:'website', title:'公司信箱', meta:'mail.company.com', totp:0.29, code:'482 913' },
    { cat:'website', title:'GitHub', meta:'github.com · gitlab.internal.co' },
    { cat:'website', title:'銀行網銀', meta:'bank.example.com', totp:0.73, code:'057 284' },
    { cat:'website', title:'雲端硬碟', meta:'drive.example.com' },
    { cat:'website', title:'公司 VPN', meta:'vpn.company.com', totp:0.12, code:'913 660' },
    { cat:'website', title:'線上購物', meta:'shop.example.com' },
    { cat:'website', title:'串流影音', meta:'stream.example.com' },
    { cat:'website', title:'記帳 App', meta:'budget.example.com', totp:0.55, code:'204 771' },
    { cat:'website', title:'家用路由器', meta:'192.168.1.1' },
    { cat:'website', title:'公司 Wiki', meta:'wiki.company.internal' },
    { cat:'file', title:'專案合約書.pdf', meta:'已加密檔案關聯' },
    { cat:'file', title:'報稅資料.xlsx', meta:'已加密檔案關聯' },
    { cat:'file', title:'密碼管理備份.zip', meta:'已加密檔案關聯' },
  ];

  const eyeIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const editIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

  function totpBadgeHtml(ratio) {
    return `<div class="totp-badge">
      <img src="../../assets/Notebook_Pocket_Watch.svg" alt="" />
      <div class="totp-pie" style="--totp-ratio:${ratio}"></div>
    </div>`;
  }

  function renderEntryRow(entry) {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `
      <div class="entry-main"><span class="entry-cat ${entry.cat}"></span><span class="entry-title">${entry.title}</span><span class="entry-meta">${entry.meta}</span></div>
      <div class="entry-secret"><span class="dots">••••••••</span><button class="eye-btn">${eyeIconSvg}</button></div>
      <div class="totp-code">${entry.code !== undefined ? entry.code : ''}</div>
      <div class="totp-slot">${entry.totp !== undefined ? totpBadgeHtml(entry.totp) : ''}</div>
      <div class="entry-actions"><button title="編輯">${editIconSvg}</button></div>
    `;
    return row;
  }

  let activeCategory = 'website';
  let searchTerm = '';
  let currentPage = 1;

  function filteredEntries() {
    return ALL_ENTRIES.filter((e) => e.cat === activeCategory)
      .filter((e) => !searchTerm || (e.title + e.meta).toLowerCase().includes(searchTerm.toLowerCase()));
  }

  function render() {
    const entries = filteredEntries();
    const totalPages = Math.max(1, Math.ceil(entries.length / ROWS_PER_PAGE));
    currentPage = Math.min(currentPage, totalPages);
    const start = (currentPage - 1) * ROWS_PER_PAGE;
    const pageEntries = entries.slice(start, start + ROWS_PER_PAGE);

    const list = document.getElementById('entryList');
    list.innerHTML = '';
    pageEntries.forEach((entry) => list.appendChild(renderEntryRow(entry)));

    document.getElementById('pagerNum').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('pagerPrev').disabled = currentPage <= 1;
    document.getElementById('pagerNext').disabled = currentPage >= totalPages;
    document.getElementById('pageStats').textContent = `${ALL_ENTRIES.length} 筆憑證 · 目前顯示「${activeCategory === 'website' ? '網站帳密' : '已加密檔案'}」分類`;
  }

  document.getElementById('pagerPrev').addEventListener('click', () => { currentPage -= 1; render(); });
  document.getElementById('pagerNext').addEventListener('click', () => { currentPage += 1; render(); });
  document.getElementById('searchBox').addEventListener('input', (e) => { searchTerm = e.target.value; currentPage = 1; render(); });

  const tabWebsite = document.getElementById('tabWebsite');
  const tabFile = document.getElementById('tabFile');
  function selectCategory(cat) {
    activeCategory = cat;
    currentPage = 1;
    tabWebsite.classList.toggle('active', cat === 'website');
    tabWebsite.classList.toggle('inactive', cat !== 'website');
    tabFile.classList.toggle('active', cat === 'file');
    tabFile.classList.toggle('inactive', cat !== 'file');
    render();
  }
  tabWebsite.addEventListener('click', () => selectCategory('website'));
  tabFile.addEventListener('click', () => selectCategory('file'));

  render();
</script>
</body>
</html>
